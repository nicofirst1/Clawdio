name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # sounddevice is deliberately excluded: no audio hardware in CI, and
      # the daemon degrades gracefully without it (offline --render, health
      # checks, and the test suite all run fine with sounddevice unimportable).
      - name: Install dependencies
        run: pip install numpy scipy pytest

      - name: Run tests
        run: python3 -m pytest tests/ -q

      - name: Check install.sh syntax
        run: bash -n install.sh

      - name: Render smoke test
        run: |
          python3 src/sonifier.py --render demos/demo-session.jsonl /tmp/ci.wav --seed 7
          test -s /tmp/ci.wav
