<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claudio &middot; activity</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="viz-body">
<div class="viz">
  <header class="viz-head">
    <div class="brand">
      <h1>Claudio</h1>
      <p class="sub">activity log</p>
    </div>
    <div class="head-right">
      <div class="status" id="status"><span class="dot"></span><span class="txt">connecting</span></div>
      <a class="back-link" href="/">&laquo; panel</a>
    </div>
  </header>
  <section class="viz-panel">
    <div class="bars-wrap">
      <h3 class="bars-title">hooks</h3>
      <div class="bars-track-wrap">
        <div class="bars" id="bars"></div>
        <div class="bars-resize" id="bars-resize"></div>
      </div>
    </div>
    <div class="presence">
      <div class="presence-group">
        <h3>sessions <span id="sessions-count">0</span></h3>
        <div class="chips" id="sessions"></div>
      </div>
      <div class="presence-group">
        <h3>subagents <span id="agents-count">0</span></h3>
        <div class="chips chips-sm" id="agents"></div>
      </div>
    </div>
  </section>
  <main class="log" id="log">
    <div class="log-head" id="log-head">
      <span class="col-stripe"><span class="col-resize" data-col="stripe"></span></span>
      <span class="col-time">time<span class="col-resize" data-col="time"></span></span>
      <span class="col-icon"></span>
      <span class="col-session">sess<span class="col-resize" data-col="session"></span></span>
      <span class="col-label">label<span class="col-resize" data-col="label"></span></span>
      <span class="col-detail">detail</span>
    </div>
  </main>
</div>
<script src="/viz.js"></script>
</body>
</html>
